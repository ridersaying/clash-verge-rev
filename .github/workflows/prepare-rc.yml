name: Prepare RC

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: 'RC tag (vX.Y.Z-rc or vX.Y.Z-rc.N); leave empty to auto-number'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-rc
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Require the dev branch
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [[ "$SOURCE_REF" != 'refs/heads/dev' ]]; then
            echo '::error::Run Prepare RC from the dev branch.'
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'

      - name: Prepare candidate or return the existing PR
        id: candidate
        env:
          RC_TAG: ${{ inputs.rc_tag }}
        run: node scripts-workflow/rc-release.mjs prepare

      - uses: pnpm/action-setup@v6
        if: steps.candidate.outputs.existing_pr == ''
        with:
          run_install: false

      - name: Create signed candidate commit and release PR
        if: steps.candidate.outputs.existing_pr == ''
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts-workflow/rc-release.mjs create-pr
